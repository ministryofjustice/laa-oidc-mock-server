server:
  port: 9000

logging:
  level:
    org.springframework.security: trace

spring:
  security:
    oauth2:
      authorizationserver:
        client:
          bulk-claim-client:
            registration:
              client-id: "bulk-claim-client"
              client-secret: "{noop}secret"
              client-authentication-methods:
                - "client_secret_basic"
              authorization-grant-types:
                - "authorization_code"
                - "refresh_token"
                - "client_credentials"
              redirect-uris:
                - "http://${REDIRECT_BASE_URI:127.0.0.1:8082}/login/oauth2/code/silas-identity"
              post-logout-redirect-uris:
                - "http://${REDIRECT_BASE_URI:127.0.0.1:8082}/logged-out"
              scopes:
                - "openid"
                - "profile"
                - "email"

# Everyone this mock will sign in. Add an entry per user the tests need; each one's email and
# firm appear in its token, so they resolve to different people downstream.
mock:
  users:
    - username: "provider.user@provider.com"
      password: "password"

plugins {
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin' version '4.1.1'
}

group = 'uk.gov'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-authorization-server'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'commons-logging:commons-logging' // required by spring-core logging bridge in Boot 4
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

// The shared plugin enables Checkstyle, but this project has no Checkstyle ruleset.
tasks.withType(Checkstyle).configureEach {
    enabled = false
}

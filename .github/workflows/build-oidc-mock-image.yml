name: Build and Publish OIDC mock image to ECR

on:
  push:

jobs:
  build:
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/gradle-build-and-publish.yml@v2
    permissions:
      contents: write
      packages: write
    with:
      java_version: '25'
      publish_package: 'false'
      junit_results: 'false'
      junit_report: 'false'
      checkstyle_report: 'false'
      jacoco_coverage_report: 'false'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  ecr-publish-image:
    needs: [ build ]
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/ecr-publish-image.yml@v2
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    with:
      java_version: '25'
      dockerfile_path: 'Dockerfile'
      image_version: ${{ format('{0}-{1}', vars.LAA_OIDC_MOCK_SERVER_IMAGE_PREFIX, needs.build.outputs.published_artifact_version) }}
      image_scan: 'false'
      publish: ${{ github.ref_name == 'main' && 'true' || 'false' }}
      tag_with_latest: ${{ github.ref_name == 'main' && 'true' || 'false' }}
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      ecr_repository: ${{ vars.LAA_OIDC_MOCK_SERVER_ECR_REPOSITORY }}
      ecr_region: ${{ vars.LAA_OIDC_MOCK_SERVER_ECR_REGION }}
      ecr_role_to_assume: ${{ secrets.LAA_OIDC_MOCK_SERVER_ECR_ROLE_TO_ASSUME }}
